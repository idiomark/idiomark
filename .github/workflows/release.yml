name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships npm 10.x.
      # Pin to 11.x: npm 12 hard-fails on the --git-checks flag changesets passes.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install
        run: pnpm install --frozen-lockfile

      # Publishing without a build ships dead tarballs (package.json + README,
      # no dist) — 0.1.2 shipped exactly that. Build is mandatory before publish.
      - name: Build
        run: pnpm build

      - name: Version or publish
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          title: "chore: version packages"
          commit: "chore: version packages"
