version: 2
updates:
  # single entry at the workspace root — dependabot resolves pnpm workspaces,
  # so this covers every package in one update stream instead of one per package
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # collapse minor+patch into one PR; majors still come individually
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
